# ========================================
# Squirrel 独立部署覆盖配置示例
# ========================================
#
# 使用方法：
# 1. 复制此文件为 docker-compose.override.yaml：
#    cp docker-compose.override.example.yaml docker-compose.override.yaml
#
# 2. 修改 .env 文件，配置外部数据库连接：
#    REDIS_HOST=host.docker.internal (或外部 IP)
#    POSTGRES_HOST=host.docker.internal (或外部 IP)
#
# 3. 正常启动服务：
#    docker compose up -d
#
# Docker Compose 会自动合并 docker-compose.yaml 和 docker-compose.override.yaml
# ========================================

version: '3.8'

services:
  squirrel:
    # 移除对 redis 和 postgres 的依赖
    depends_on: {}

  # 禁用 redis 服务
  redis:
    deploy:
      replicas: 0
    restart: "no"

  # 禁用 postgres 服务
  postgres:
    deploy:
      replicas: 0
    restart: "no"


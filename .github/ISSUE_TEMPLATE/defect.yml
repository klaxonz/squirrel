name: 缺陷
description: 提交一个可复现的问题或回归缺陷
title: '[Defect] '
labels:
  - type:defect
  - status:intake
body:
  - type: input
    id: summary
    attributes:
      label: 缺陷标题
      description: 用一句话概括问题
      placeholder: 例如：Pornhub 视频封面偶发下载失败
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 严重级别
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 影响范围
      description: 谁会受影响？频率如何？是否阻断主流程？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量写成稳定可复现的步骤
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境信息
      description: 分支、平台、浏览器、站点、日志时间等

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图 / 补充信息
      description: 粘贴报错、截图、trace、视频链接等

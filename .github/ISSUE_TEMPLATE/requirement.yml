name: 需求
description: 提交一个新的需求、改进项或能力建设项
title: '[Requirement] '
labels:
  - type:requirement
  - status:intake
body:
  - type: input
    id: summary
    attributes:
      label: 需求标题
      description: 用一句话概括需求
      placeholder: 例如：为 Sync Center 增加失败重试摘要
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 背景 / 问题
      description: 这个需求要解决什么问题？
      placeholder: 当前流程、痛点、触发场景
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 你希望最终达到什么效果？
      placeholder: 用户能看到什么、系统会做什么
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 用 checklist 写出完成标准
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - P0
        - P1
        - P2
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: 约束 / 非目标
      description: 例如不能改接口、不能加依赖、只限前端等

  - type: textarea
    id: links
    attributes:
      label: 相关链接
      description: PRD、设计稿、讨论帖、截图等


name: Build and Push Base Image

on:
  push:
    paths:
      - 'Dockerfile.base'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: runtime-base
            tag: runtime
            cache_scope: base-runtime
          - target: build-base
            tag: build
            cache_scope: base-build

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          target: ${{ matrix.target }}
          push: true
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/squirrel-base:${{ matrix.tag }}
            ghcr.io/${{ github.repository_owner }}/squirrel-base:${{ matrix.tag }}-${{ github.sha }}

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: squirrel-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Pipenv
        run: python -m pip install --upgrade pipenv
      - name: Install locked dependencies
        run: pipenv sync --dev
      - name: Run backend tests
        run: pipenv run pytest
      - name: Run Ruff
        run: pipenv run ruff check .
      - name: Compile backend sources
        run: pipenv run python -m compileall -q .

  desktop:
    name: Desktop checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Run desktop lint
        run: npm run lint
        working-directory: squirrel-desktop
      - name: Run desktop typecheck
        run: npm run typecheck
        working-directory: squirrel-desktop
      - name: Run desktop unit tests
        run: npm run test && npm run test:renderer
        working-directory: squirrel-desktop
      - name: Run desktop build
        run: npm run build
        working-directory: squirrel-desktop
      - name: Run desktop checks
        run: npm run check
        working-directory: squirrel-desktop

  e2e:
    name: Electron E2E (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Run Electron smoke tests
        run: npm run test:electron
        working-directory: squirrel-desktop
      - name: Upload Electron E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-artifacts
          path: |
            squirrel-desktop/test-results/
            squirrel-desktop/visual-review-results/
            squirrel-desktop/runtime-logs/
          if-no-files-found: ignore

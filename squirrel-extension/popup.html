<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Squirrel</title>
  <style>
    :root {
      /* Theme Colors */
      --font-sans: 'Roboto', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      --bg-dark: #0f0f0f;
      --bg-hover: #2a2a2a;
      --text-primary: #e0e0e0;
      --text-secondary: #888;
      --accent: #ef4444;
      --accent-hover: #dc2626;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
      --border: rgba(255, 255, 255, 0.1);
      --divider: rgba(255, 255, 255, 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 240px;
      font-family: var(--font-sans);
      background: var(--bg-dark);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      padding: 12px;
    }

    .action-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: none;
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      user-select: none;
    }

    .action-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .action-btn.subscribed {
      background: var(--accent);
      color: white;
      position: relative;
      overflow: hidden;
    }

    .action-btn.subscribed::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to right, rgba(255, 255, 255, 0.1), transparent);
      pointer-events: none;
    }

    .action-btn.subscribed:hover {
      background: var(--accent-hover);
    }

    .icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    .status {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      animation: slideIn 0.2s ease;
    }

    .success {
      background: rgba(34, 197, 94, 0.1);
      color: var(--success);
    }

    .error {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
    }

    .warning {
      background: rgba(245, 158, 11, 0.1);
      color: var(--warning);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="action-list">
    <button id="downloadButton" class="action-btn">
      ↓
      下载视频
    </button>

    <button id="subscribeButton" class="action-btn">
      👤 订阅频道
    </button>

    <button id="settingsButton" class="action-btn">
      ⚙️ 设置
    </button>
  </div>

  <div id="status" class="status"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>

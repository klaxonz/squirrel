version: '3.8'

networks:
  squirrel-network:
    driver: bridge

services:
  squirrel:
    image: klaxonz/squirrel:latest
    container_name: squirrel
    restart: always
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      # 这些环境变量需要在 .env 文件中配置为外部服务的地址
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-squirrel}
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./downloads:/downloads
      - ./plugins_ext:/app/squirrel-backend/plugins_ext
    networks:
      - squirrel-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


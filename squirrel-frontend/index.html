<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/squirrel-icon.png" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>归仓 · 视频订阅与收藏</title>
    <script>
      try {
        const storageKey = 'app:theme';
        const legacyKey = 'squirrel-app-theme';
        let storedMode = window.localStorage.getItem(storageKey);
        if (storedMode === null) {
          const legacy = window.localStorage.getItem(legacyKey);
          if (legacy !== null) {
            storedMode = legacy;
            window.localStorage.setItem(storageKey, legacy);
            window.localStorage.removeItem(legacyKey);
          }
        }
        const isSystemMode = storedMode === 'system' || !storedMode || (storedMode !== 'light' && storedMode !== 'dark');
        const isLight = storedMode === 'light' || (isSystemMode && !window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', !isLight);
        document.documentElement.classList.toggle('light', isLight);
        document.documentElement.dataset.theme = isLight ? 'light' : 'dark';
        document.documentElement.style.colorScheme = isLight ? 'light' : 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>

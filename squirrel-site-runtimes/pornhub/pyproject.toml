[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "squirrel-plugin-pornhub"
version = "0.1.0"
description = "Pornhub crawl plugin for Squirrel"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Squirrel" }]
dependencies = [
  "squirrel-sdk>=2.0.0",
  "beautifulsoup4>=4.12.0",
  "yt-dlp>=2024.3.10",
  "phub",
  "httpx>=0.27.0",
  "fastapi>=0.111.0",
  "starlette>=0.37.2",
]

[project.entry-points."squirrel.site_runtimes"]
pornhub = "squirrel_pornhub.runtime:get_site_runtime"

[tool.setuptools.packages.find]
where = ["src"]



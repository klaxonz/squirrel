# ========================================
# Squirrel Docker Compose 配置
# ========================================
#
# 支持两种部署模式：
#
# 1. 完整部署（默认）：
#    - 启动 Squirrel、Redis 和 PostgreSQL 三个服务
#    - 使用命令: docker compose up -d
#
# 2. 独立部署（连接外部数据库）：
#    - 仅启动 Squirrel 服务，不启动 Redis 和 PostgreSQL
#    - 修改 .env 文件中的数据库连接配置：
#      REDIS_HOST=你的Redis地址
#      POSTGRES_HOST=你的PostgreSQL地址
#    - 使用命令: docker compose up -d --no-deps squirrel
#      (--no-deps 参数会跳过依赖服务，不拉取镜像)
#
# ========================================

version: '3.8'

networks:
  squirrel-network:
    driver: bridge

services:
  squirrel:
    image: klaxonz/squirrel:latest
    container_name: squirrel
    restart: always
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      # 以下配置从 .env 文件读取，支持连接内部或外部服务
      - REDIS_HOST=${REDIS_HOST:-redis}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./downloads:/downloads
      - ./plugins_ext:/app/squirrel-backend/plugins_ext
    networks:
      - squirrel-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: squirrel-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-squirrel123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis/data:/data
    networks:
      - squirrel-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-squirrel123}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: squirrel-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${POSTGRES_DATABASE:-squirrel}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    networks:
      - squirrel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-squirrel}"]
      interval: 10s
      timeout: 5s
      retries: 5
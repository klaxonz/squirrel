# ========================================
# Squirrel Docker Compose 配置
# ========================================
#
# 支持两种部署模式：
#
# 1. 完整部署（默认）：
#    - 启动 Squirrel 主服务、Worker、Scheduler、Redis 和 PostgreSQL
#    - 使用命令: docker compose up -d
#
# 2. 独立部署（连接外部数据库）：
#    - 仅启动 Squirrel 服务，不启动 Redis 和 PostgreSQL
#    - 修改 .env 文件中的数据库连接配置
#    - 使用命令: docker compose up -d --no-deps squirrel squirrel-worker squirrel-scheduler
#
# ========================================

networks:
  squirrel-network:
    driver: bridge

services:
  squirrel-cf-bypass:
    image: klaxonz/squirrel-cf-bypass:latest
    container_name: squirrel-cf-bypass
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8001:8001"
    networks:
      - squirrel-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ========================================
  # Squirrel 主服务（FastAPI Web 服务）
  # ========================================
  squirrel:
    image: klaxonz/squirrel:latest
    container_name: squirrel
    restart: always
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - REDIS_HOST=${REDIS_HOST:-redis}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - THUMBNAILS_PATH=${THUMBNAILS_PATH:-/thumbnails}
    ports:
      - "${SQUIRREL_PORT:-8000}:8000"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./downloads:/downloads
      - ./thumbnails:/thumbnails
    networks:
      - squirrel-network
    depends_on:
      squirrel-cf-bypass:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # Squirrel Worker 进程（任务处理）
  # ========================================
  squirrel-worker:
    image: klaxonz/squirrel:latest
    container_name: squirrel-worker
    restart: always
    command: ["python", "-m", "processes.worker_process"]
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - THUMBNAILS_PATH=${THUMBNAILS_PATH:-/thumbnails}
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./downloads:/downloads
      - ./thumbnails:/thumbnails
    networks:
      - squirrel-network
    depends_on:
      squirrel-cf-bypass:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  # ========================================
  # Squirrel Scheduler 进程（定时任务）
  # ========================================
  squirrel-scheduler:
    image: klaxonz/squirrel:latest
    container_name: squirrel-scheduler
    restart: always
    command: ["python", "-m", "processes.scheduler_process"]
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - THUMBNAILS_PATH=${THUMBNAILS_PATH:-/thumbnails}
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./downloads:/downloads
      - ./thumbnails:/thumbnails
    networks:
      - squirrel-network
    depends_on:
      squirrel-cf-bypass:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  # ========================================
  # Redis 服务（缓存和消息队列）
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: squirrel-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-squirrel123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis/data:/data
    networks:
      - squirrel-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-squirrel123}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ========================================
  # PostgreSQL 服务（数据库）
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: squirrel-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${POSTGRES_DATABASE:-squirrel}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    networks:
      - squirrel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-squirrel}"]
      interval: 10s
      timeout: 5s
      retries: 5

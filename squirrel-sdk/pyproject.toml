[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "squirrel-sdk"
version = "2.0.0"
description = "Squirrel plugin SDK (stable plugin-facing API surface) - v2.0 with Protocol-based interfaces"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Squirrel", email = "devnull@example.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "requests>=2.31.0",
]

[project.urls]
homepage = "https://example.com"
repository = "https://example.com/squirrel"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.md"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"src/crawl/__init__.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"



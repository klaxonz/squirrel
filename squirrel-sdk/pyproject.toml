[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "squirrel-sdk"
version = "0.1.0"
description = "Squirrel plugin SDK (stable plugin-facing API surface)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Squirrel", email = "devnull@example.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
homepage = "https://example.com"
repository = "https://example.com/squirrel"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.md"]



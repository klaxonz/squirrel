[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "squirrel-plugin-javdb"
version = "0.1.0"
description = "JavDB crawl plugin for Squirrel"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Squirrel" }]
dependencies = [
  "squirrel-sdk>=2.0.0",
  "beautifulsoup4>=4.12.0",
  "httpx>=0.27.0",
  "fastapi>=0.111.0",
  "starlette>=0.37.2",
]

[project.entry-points."squirrel.plugins"]
javdb = "squirrel_javdb.runtime:get_plugin_runtime"

[tool.setuptools.packages.find]
where = ["src"]



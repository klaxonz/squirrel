[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "squirrel-plugin-bilibili"
version = "0.1.0"
description = "Bilibili crawl plugin for Squirrel"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Squirrel" }]
dependencies = [
  "squirrel-sdk>=2.0.0",
  "yt-dlp>=2024.3.10",
]

[project.entry-points."squirrel.plugins"]
bilibili = "squirrel_bilibili.runtime:get_plugin_runtime"

[tool.setuptools.packages.find]
where = ["src"]



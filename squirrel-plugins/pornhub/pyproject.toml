[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "squirrel-plugin-pornhub"
version = "0.1.0"
description = "Pornhub crawl plugin for Squirrel"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Squirrel" }]
dependencies = [
  "squirrel-sdk>=2.0.0",
  "beautifulsoup4>=4.12.0",
]

[project.entry-points]
"squirrel.crawl.plugins" = { pornhub = "squirrel_pornhub" }

[tool.setuptools.packages.find]
where = ["src"]



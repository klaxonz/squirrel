[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "squirrel-plugin-youtube"
version = "0.1.0"
description = "YouTube crawl plugin for Squirrel"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Squirrel" }]
dependencies = [
  "squirrel-sdk>=2.0.0",
  "beautifulsoup4>=4.12.0",
  "pytubefix>=7.3.0",
  "yt-dlp>=2024.3.10",
  "httpx>=0.27.0",
  "fastapi>=0.111.0",
  "starlette>=0.37.2",
]

[project.entry-points."squirrel.plugins"]
youtube = "squirrel_youtube.runtime:get_plugin_runtime"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
squirrel_youtube = [
  "node/**/*",
]



[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "squirrel-plugin-youtube"
version = "0.1.0"
description = "YouTube crawl plugin for Squirrel"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Squirrel" }]
dependencies = [
  "squirrel-sdk>=0.1.0",
  "pytubefix>=7.3.0",
  "yt-dlp>=2024.3.10",
]

[project.entry-points]
"squirrel.crawl.plugins" = { youtube = "squirrel_youtube" }

[tool.setuptools.packages.find]
where = ["src"]


